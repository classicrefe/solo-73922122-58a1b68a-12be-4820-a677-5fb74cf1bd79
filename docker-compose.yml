services:
  audit-web:
    build: .
    image: aluminum-recycled-audit:latest
    container_name: aluminum-audit
    ports:
      - "8000:8000"
    environment:
      AUDIT_DB_PATH: /data/audit.db
      AUDIT_SECRET_KEY: change-me-in-production
    volumes:
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  audit-data:
